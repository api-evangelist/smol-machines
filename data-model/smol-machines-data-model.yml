notes: >-
  Two APIs share one Machine mental model. The local smolvm API models
  Sandboxes (which own Containers and Images) and standalone Microvms. The cloud
  smolfleet control plane models Machines (with Sessions, Volumes, mounts) plus
  the multi-tenant/cluster layer (Tenants, Nodes, Pools, ApiKeys, Tokens, Plans,
  Operations, Apps).
