overlay: 1.0.0
info:
  title: API Evangelist enhancements for Smol Machines — smolfleet Cloud API
  version: 1.0.0
extends: openapi/smol-machines-smolfleet-openapi.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: smol-machines
    x-apievangelist-artifacts:
      authentication: authentication/smol-machines-authentication.yml
      errors: errors/smol-machines-problem-types.yml
      conventions: conventions/smol-machines-conventions.yml
      lifecycle: lifecycle/smol-machines-lifecycle.yml
      data_model: data-model/smol-machines-data-model.yml
- target: $.servers
  update:
  - url: https://api.smolmachines.com
    description: Hosted smolfleet
- target: $.components.securitySchemes
  update:
    CloudBearerApiKey:
      type: http
      scheme: bearer
      description: >-
        Authorization: Bearer smk_<api_key>. Documented but not declared in the
        upstream spec; captured here from smolmachines.com/docs/cloud-api.
