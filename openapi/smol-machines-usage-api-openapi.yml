openapi: 3.1.0
info:
  title: smolfleet apikeys usage API
  description: Control plane for smolvm — deploy and run machines across a cluster.
  license:
    name: Apache-2.0
  version: 0.1.0
servers:
- url: https://api.smolmachines.com
  description: Hosted smolfleet
tags:
- name: usage
  description: Usage and billing
paths:
  /v1/usage:
    get:
      tags:
      - usage
      operationId: usage_query
      responses:
        '200':
          description: Usage report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
components:
  schemas:
    UsageResponse:
      type: object
      required:
      - tenantId
      - from
      - to
      - totalUptimeSeconds
      - cpuHours
      - memoryGbHours
      - machineCount
      - execCount
      - execDurationMs
      properties:
        cpuHours:
          type: number
          format: double
        execCount:
          type: integer
          format: int32
          minimum: 0
        execDurationMs:
          type: integer
          format: int64
          minimum: 0
        from:
          type: string
        machineCount:
          type: integer
          format: int32
          minimum: 0
        memoryGbHours:
          type: number
          format: double
        tenantId:
          type: string
        to:
          type: string
        totalUptimeSeconds:
          type: integer
          format: int64
          minimum: 0
