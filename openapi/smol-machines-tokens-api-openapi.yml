openapi: 3.2.0
info:
  title: smolfleet Tokens API
  description: Control plane for smolvm — deploy and run machines across a cluster.
  license:
    name: Apache-2.0
  version: 0.1.0
servers:
- url: https://api.smolmachines.com
  description: Hosted smolfleet
tags:
- name: Tokens
  description: Node join tokens
paths:
  /v1/tokens:
    get:
      tags:
      - Tokens
      operationId: token_list
      responses:
        '200':
          description: List join tokens
      summary: Token list
      x-summary-source: derived
    post:
      tags:
      - Tokens
      operationId: token_create
      responses:
        '200':
          description: Join token created
      summary: Token create
      x-summary-source: derived
  /v1/tokens/{prefix}:
    delete:
      tags:
      - Tokens
      operationId: token_delete
      parameters:
      - name: prefix
        in: path
        description: Token prefix
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Token deleted
      summary: Token delete
      x-summary-source: derived
