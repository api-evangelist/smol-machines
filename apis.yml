aid: smol-machines
name: Smol Machines
description: >-
  Smol Machines (smol machines, inc.) is a Y Combinator-backed developer
  infrastructure company building portable, self-contained Linux microVMs.
  Its open-source `smolvm` engine and `smol` CLI (both Rust, Apache-2.0) boot
  hardware-isolated virtual machines from any OCI image in under 200ms — on a
  laptop, in the smolfleet cloud, or self-hosted — with no daemon and no Docker.
  The same Machine API runs locally as an in-process microVM or against the
  hosted smolfleet control plane at api.smolmachines.com, so teams sandbox
  untrusted code and AI-agent workloads, ship stateful `.smolmachine` artifacts,
  and deploy machines across a cluster without changing a line. Node and Python
  SDKs (`smolmachines`), a local REST API, and a cloud REST API are all public.
